<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f1117" />
    <title>Page Not Found | Emmanuel Onyekachi</title>
    <script>
      try {
        var savedTheme = localStorage.getItem('theme')
        var systemLight = window.matchMedia('(prefers-color-scheme: light)').matches
        if (savedTheme === 'light' || (!savedTheme && systemLight)) {
          document.documentElement.className = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#f7f5f1'
        }
      } catch (error) {}
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1117;
        --surface: #151821;
        --text: #f4f6fb;
        --muted: #9ca3af;
        --edge: rgb(255 255 255 / 0.14);
        --accent: #4f9cf9;
        --accent-text: #07111f;
      }

      .light {
        color-scheme: light;
        --bg: #f7f5f1;
        --surface: #fff;
        --text: #15171c;
        --muted: #5f6670;
        --edge: rgb(15 17 23 / 0.14);
        --accent: #1d4ed8;
        --accent-text: #fff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(1rem, 4vw, 2.5rem);
        background:
          radial-gradient(circle at 15% 15%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 34%),
          var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 720px);
        border: 1px solid var(--edge);
        border-radius: 1.25rem;
        background: var(--surface);
        padding: clamp(1.5rem, 7vw, 4rem);
        box-shadow: 0 24px 70px rgb(0 0 0 / 0.16);
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: .2rem;
        margin-bottom: clamp(2rem, 6vw, 4rem);
        color: var(--accent);
        font: 700 1.35rem/1 ui-monospace, monospace;
      }
      .mark span { color: var(--text); }
      .eyebrow {
        margin: 0 0 .8rem;
        color: var(--accent);
        font: 700 .75rem/1.2 ui-monospace, monospace;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        max-width: 11ch;
        font-size: clamp(2.5rem, 10vw, 5.5rem);
        line-height: .98;
        letter-spacing: -.055em;
      }
      p {
        max-width: 34rem;
        margin: 1.5rem 0 0;
        color: var(--muted);
        font-size: clamp(.95rem, 2vw, 1.08rem);
        line-height: 1.75;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: .75rem;
        margin-top: 2rem;
      }
      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--edge);
        border-radius: .65rem;
        padding: .7rem 1.15rem;
        color: var(--text);
        font-size: .9rem;
        font-weight: 700;
        text-decoration: none;
        transition: transform 300ms, border-color 300ms, color 300ms, background-color 300ms;
      }
      a:first-child { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
      a:hover { border-color: var(--accent); color: var(--accent); }
      a:first-child:hover { color: var(--accent-text); filter: brightness(.94); }
      a:active { transform: scale(.97); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <a class="mark" href="/" aria-label="Emmanuel Onyekachi — homepage">{<span>E</span>}</a>
      <p class="eyebrow">Error 404</p>
      <h1>This page wandered off.</h1>
      <p>The address may have changed or the link may be incomplete. The portfolio and every published project are still available from the homepage.</p>
      <nav aria-label="Error page actions">
        <a href="/">Return home</a>
        <a href="mailto:emmanuel.onyekachi.dev@gmail.com">Email Emmanuel</a>
      </nav>
    </main>
  </body>
</html>
