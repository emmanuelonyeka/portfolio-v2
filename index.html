    <script>
      // Runs before the app mounts, so the correct theme is on <html> for the
      // very first paint. Reading this in a React effect is what caused the flash.
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          if (saved === 'light' || (!saved && prefersLight)) {
            document.documentElement.classList.add('theme-light')
          }
        } catch (e) {}

        // Take scroll restoration off the browser. It fires while the document
        // is a fraction of its final height and clamps the result, which is why
        // a reload could land in the wrong section.
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
        } catch (e) {}

        // Hide the page only while a reload/history position is being
        // re-asserted. On reload the saved position outranks a stale #work
        // fragment; on a genuinely new visit, the fragment remains intentional.
        try {
          var navigation = performance.getEntriesByType
            ? performance.getEntriesByType('navigation')[0]
            : null
          var legacyType = performance.navigation ? performance.navigation.type : -1
          var shouldRestore = navigation
            ? navigation.type === 'reload' || navigation.type === 'back_forward'
            : legacyType === 1 || legacyType === 2

          if (shouldRestore && sessionStorage.getItem('emmanuel:scroll') !== null) {
            document.documentElement.classList.add('restoring')
            // Failsafe: lifts even if the bundle never runs. The page can never
            // be left blank by this.
            setTimeout(function () {
              document.documentElement.classList.remove('restoring')
            }, 3000)
          }
        } catch (e) {}
      })()
    </script>
